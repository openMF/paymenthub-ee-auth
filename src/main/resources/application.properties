fineract.datasource.core.host=operations-mysql
fineract.datasource.core.port=3306
fineract.datasource.core.schema=tenants
fineract.datasource.core.username=root
fineract.datasource.core.password=mysql
# Set to false when the database belongs to another service. This one ships
# tenant_server_connections as V1 and ph-ee-operations-app ships it as V2, so on a
# shared schema Flyway replays it and the application fails to start. Off, no migration
# is applied to any schema, core or tenant, and this service only reads what the owner
# put there. It covers the tenants too: their own auto_update column defaults to 1 and
# lives in a table in the core schema, so it is not something an operator of this
# service can set without writing into the schema we are trying not to touch.
fineract.datasource.core.auto-update=true

fineract.datasource.common.protocol=jdbc
fineract.datasource.common.subprotocol=mysql
fineract.datasource.common.driverclass_name=com.mysql.cj.jdbc.Driver

token.access.validity-seconds=600
token.refresh.validity-seconds=43200

caching.enabled=false

# SB3 renamed this key (was security.filter-order). It has to stay set: the
# default is now -100, which puts the Spring Security chain BEFORE the tenant
# filter, and the token audience check then runs with no tenant in context.
spring.security.filter.order=5
spring.web.resources.add-mappings=false
spring.jmx.enabled=false
server.port=5000
